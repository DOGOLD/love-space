<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜蜜空间 - 情侣专属</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB6C1',
                        secondary: '#E6E6FA',
                        accent: '#87CEEB',
                        warm: '#FFF5E6',
                        cream: '#FFFAF0'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50 min-h-screen">
    <div id="app">
        <div class="flex items-center justify-center min-h-screen p-4 sm:p-6 md:p-8">
            <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-xl p-6 sm:p-8 w-full max-w-md animate-fade-in">
                <div class="text-center mb-6 sm:mb-8">
                    <div class="text-5xl sm:text-6xl mb-3 sm:mb-4">💕</div>
                    <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">甜蜜空间</h1>
                    <p class="text-gray-500 mt-2 text-sm sm:text-base">记录你们的爱情故事</p>
                </div>

                <form onsubmit="return false;" class="space-y-6">
                    <div>
                        <label class="block text-gray-600 mb-2">账号</label>
                        <input 
                            type="text" 
                            v-model="loginForm.username" 
                            placeholder="请输入账号"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-pink-300 focus:ring-2 focus:ring-pink-200 outline-none transition-all"
                        >
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-2">密码</label>
                        <input 
                            type="password" 
                            v-model="loginForm.password" 
                            placeholder="请输入密码"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-pink-300 focus:ring-2 focus:ring-pink-200 outline-none transition-all"
                        >
                    </div>
                    <div class="text-red-400 text-sm text-center bg-red-50 p-3 rounded-xl" :style="{ visibility: errorMsg ? 'visible' : 'hidden' }">
                        {{ errorMsg }}
                    </div>
                    <button 
                        @click="handleLogin"
                        class="w-full bg-gradient-to-r from-pink-400 to-purple-400 text-white py-3 rounded-xl font-medium hover:shadow-lg hover:scale-105 transition-all duration-300 btn-press"
                    >
                        登录
                    </button>
                </form>

                <div class="text-center mt-6">
                    <span class="text-gray-500">还没有账号？</span>
                    <a href="register.html" class="text-pink-400 hover:text-pink-500 ml-1">立即注册</a>
                </div>
            </div>
        </div>

        <div id="hearts-container"></div>
    </div>

    <script src="utils/storage.js"></script>
    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    loginForm: {
                        username: '',
                        password: ''
                    },
                    errorMsg: ''
                };
            },
            methods: {
                handleLogin() {
                    this.errorMsg = '';
                    
                    if (!this.loginForm.username || !this.loginForm.password) {
                        this.errorMsg = '请输入账号和密码';
                        return;
                    }

                    const user = Storage.users.findByUsername(this.loginForm.username);
                    if (!user) {
                        this.errorMsg = '账号不存在，请先注册';
                        return;
                    }

                    if (user.password !== this.loginForm.password) {
                        this.errorMsg = '密码错误，请重新输入';
                        return;
                    }

                    Storage.currentUser.set(user);

                    if (user.profile && user.profile.nickname && user.profile.city) {
                        window.location.href = 'home.html';
                    } else {
                        window.location.href = 'profile.html';
                    }
                }
            },
            mounted() {
                console.log('登录页面Vue已成功挂载');
                const currentUser = Storage.currentUser.get();
                if (currentUser) {
                    window.location.href = 'home.html';
                }
            }
        }).mount('#app');
    </script>
    <script src="assets/js/effects.js"></script>
</body>
</html>
